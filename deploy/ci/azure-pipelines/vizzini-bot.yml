# vizzini-bot for Azure Pipelines. Commit as .azure-pipelines/vizzini-bot.yml,
# create a pipeline from it, and add it as a build validation policy on the
# branches pull requests target. Setup and the first run:
# deploy/ci/README.md (Vizzini repository).
#
# On every update of a pull request, vizzini-bot reviews what changed since
# its last review, posts the findings as comment threads, resolves its own
# threads whose code was fixed, and answers /vizzini commands written in the
# PR's threads, all through mrman, which acts only when the grant policy
# committed on the target branch (.vizzini/grant-policy) allows it.
#
# The job posts as the pipeline's identity, "<Project> Build Service (<org>)".
# Give it "Contribute to pull requests" on the repository (Project settings >
# Repositories > Security).
#
# On Azure DevOps Server (2022.1 or later), the job lists your server in
# mrman's config ([[forge.hosts]]: the host of System.CollectionUri, that URL
# as api_base, and the token as "$AZURE_DEVOPS_EXT_PAT", which mrman reads
# from the environment when it runs). mrman sends tokens only to hosts it
# knows; dev.azure.com needs no entry. If your server uses a private CA, add
# ca_file = "<PEM bundle>" to that entry. Use a self-hosted agent pool in
# place of vmImage.
#
# Pipeline variables:
#   VIZZINI_LITELLM_URL  your LiteLLM proxy, e.g. https://litellm.example.com/v1
#   VIZZINI_MODEL        a model name configured in that proxy
#   VIZZINI_API_KEY      a LiteLLM virtual key for the bot (secret)

trigger: none # pull requests trigger it through the build validation policy

pool:
  vmImage: ubuntu-latest

variables:
  # Pins: the Vizzini release (VIZZINI_REF is its commit), the mrman release and
  # the garmr release. Change them in a reviewed commit.
  VIZZINI_REF: ebb7322b883e378a8bbfd12e07401e6202d0af00 # v0.1.3
  VIZZINI_VERSION: v0.1.3
  MRMAN_VERSION: v0.1.10
  GARMR_VERSION: v0.1.0

steps:
  - checkout: self
    fetchDepth: 0 # full history, for incremental review
    persistCredentials: false

  - bash: |
      set -euo pipefail
      # Only the pinned commit, and only the files of deploy/ci and scripts:
      # enough while VIZZINI_VERSION is set. To build vizzini-bot from source
      # instead, remove the sparse-checkout line.
      src="$AGENT_TEMPDIRECTORY/vizzini-src"
      git -c init.defaultBranch=main init --quiet "$src"
      git -C "$src" remote add origin https://github.com/infrashift/vizzini-pr-reviewer.git
      git -C "$src" sparse-checkout set deploy/ci scripts
      git -C "$src" fetch --quiet --depth 1 --filter=blob:none origin "$VIZZINI_REF"
      git -C "$src" checkout --quiet FETCH_HEAD
      # The tools directory stays between jobs on a self-hosted agent, so later
      # jobs skip the downloads (deploy/ci/README.md, Tools cache).
      VIZZINI_TOOLS_CACHE="$AGENT_TOOLSDIRECTORY/vizzini" \
        "$AGENT_TEMPDIRECTORY/vizzini-src/deploy/ci/install.sh" "$AGENT_TEMPDIRECTORY/vizzini"
      echo "##vso[task.prependpath]$AGENT_TEMPDIRECTORY/vizzini/bin"
      echo "##vso[task.setvariable variable=TIKTOKEN_CACHE_DIR]$AGENT_TEMPDIRECTORY/vizzini/tiktoken"
    displayName: Install vizzini-bot, mrman and garmr (pinned, verified)

  - bash: |
      set -euo pipefail
      # Azure DevOps Server: list the server in mrman's config (see above).
      collection="${SYSTEM_COLLECTIONURI%/}"
      server="${collection#*://}"
      server="${server%%/*}"
      server="${server%%:*}"
      case "$server" in
      dev.azure.com | *.visualstudio.com) ;;
      *)
        mrman_config="${XDG_CONFIG_HOME:-$HOME/.config}/mrman"
        mkdir -p "$mrman_config"
        # shellcheck disable=SC2016 # mrman expands $AZURE_DEVOPS_EXT_PAT when it runs
        printf '[[forge.hosts]]\nhost = "%s"\nforge = "azuredevops"\napi_base = "%s"\ntoken = "$AZURE_DEVOPS_EXT_PAT"\n' \
          "$server" "$collection" >>"$mrman_config/config.toml"
        ;;
      esac
      # https://dev.azure.com/ORG/PROJECT/_git/REPO or
      # https://SERVER/tfs/COLLECTION/PROJECT/_git/REPO, without any "ORG@"
      # user-info prefix
      repo_url="$(sed -E 's#^(https?://)[^/@]+@#\1#' <<<"$SYSTEM_PULLREQUEST_SOURCEREPOSITORYURI")"
      rest="${repo_url#*://}"
      vizzini-bot \
        --repo . \
        --base "origin/${SYSTEM_PULLREQUEST_TARGETBRANCH#refs/heads/}" \
        --head "$SYSTEM_PULLREQUEST_SOURCECOMMITID" \
        --pr-url "$repo_url/pullrequest/$SYSTEM_PULLREQUEST_PULLREQUESTID" \
        --grant-policy .vizzini/grant-policy \
        --pr "ado:${rest%%/_git/*}/${rest##*/_git/}#$SYSTEM_PULLREQUEST_PULLREQUESTID" \
        --requester "$BUILD_REQUESTEDFOR" \
        --out "$AGENT_TEMPDIRECTORY/vizzini-review.json"
    displayName: Review
    condition: eq(variables['Build.Reason'], 'PullRequest')
    env:
      AZURE_DEVOPS_EXT_PAT: $(System.AccessToken)
      VIZZINI_LITELLM_URL: $(VIZZINI_LITELLM_URL)
      VIZZINI_MODEL: $(VIZZINI_MODEL)
      VIZZINI_API_KEY: $(VIZZINI_API_KEY) # secret variables reach scripts only when mapped
