# vizzini-bot for GitLab CI. Add this job to .gitlab-ci.yml (or `include:`
# this file from your repository). Setup and the first run:
# deploy/ci/README.md (Vizzini repository).
#
# In every merge request pipeline, vizzini-bot reviews what changed since its
# last review and posts the findings as discussions through mrman, which
# posts only when the grant policy committed on the target branch
# (.vizzini/grant-policy) allows it. It also resolves its own discussions
# whose finding is gone and answers /vizzini commands in their discussions
# (mrman v0.1.6 on).
#
# CI/CD variables (Settings > CI/CD > Variables):
#   VIZZINI_LITELLM_URL   your LiteLLM proxy, e.g. https://litellm.example.com/v1
#   VIZZINI_MODEL         a model name configured in that proxy
#   VIZZINI_API_KEY       a LiteLLM virtual key for the bot (masked)
#   VIZZINI_GITLAB_TOKEN  a project access token, role Reporter or higher, scope
#                         api (masked): CI_JOB_TOKEN cannot post merge request
#                         discussions. Its bot user is the identity your grant
#                         policy must list.
#
# On a self-managed GitLab, the job lists your instance in mrman's config
# ([[forge.hosts]]: CI_SERVER_HOST, CI_API_V4_URL, and the token as
# "$GITLAB_TOKEN", which mrman reads from the environment when it runs).
# mrman sends tokens only to hosts it knows; gitlab.com needs no entry. If
# your instance uses a private CA, add ca_file = "<PEM bundle>" to that entry.

vizzini-bot:
  stage: test
  image: docker.io/library/buildpack-deps:bookworm-scm # bash, git and curl; pin it by digest in your pipeline
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
  variables:
    GIT_DEPTH: "0" # full history, for incremental review
    # Pins: the Vizzini release (VIZZINI_REF is its commit), the mrman release and
    # the garmr release. Change them in a reviewed commit.
    VIZZINI_REF: ebb7322b883e378a8bbfd12e07401e6202d0af00 # v0.1.3
    VIZZINI_VERSION: v0.1.3
    MRMAN_VERSION: v0.1.10
    GARMR_VERSION: v0.1.0
  script:
    - set -euo pipefail
    - tools="$CI_BUILDS_DIR/.vizzini-$CI_JOB_ID"
    # Only the pinned commit, and only the files of deploy/ci and scripts:
    # enough while VIZZINI_VERSION is set. To build vizzini-bot from source
    # instead, remove the sparse-checkout line.
    - |
      git -c init.defaultBranch=main init --quiet "$tools-src"
      git -C "$tools-src" remote add origin https://github.com/infrashift/vizzini-pr-reviewer.git
      git -C "$tools-src" sparse-checkout set deploy/ci scripts
      git -C "$tools-src" fetch --quiet --depth 1 --filter=blob:none origin "$VIZZINI_REF"
      git -C "$tools-src" checkout --quiet FETCH_HEAD
    # The builds directory stays between jobs on a shell executor, so later
    # jobs skip the downloads (deploy/ci/README.md, Tools cache).
    - VIZZINI_TOOLS_CACHE="$CI_BUILDS_DIR/.vizzini-cache" "$tools-src/deploy/ci/install.sh" "$tools"
    - export PATH="$tools/bin:$PATH" TIKTOKEN_CACHE_DIR="$tools/tiktoken"
    # A self-managed instance: list it in mrman's config (see above).
    - |
      if [ "$CI_SERVER_HOST" != gitlab.com ]; then
        mrman_config="${XDG_CONFIG_HOME:-$HOME/.config}/mrman"
        mkdir -p "$mrman_config"
        # shellcheck disable=SC2016 # mrman expands $GITLAB_TOKEN when it runs
        printf '[[forge.hosts]]\nhost = "%s"\nforge = "gitlab"\napi_base = "%s"\ntoken = "$GITLAB_TOKEN"\n' \
          "$CI_SERVER_HOST" "$CI_API_V4_URL" >>"$mrman_config/config.toml"
      fi
    # The target branch, as origin/<branch>, for base...head.
    - git fetch --quiet origin "+refs/heads/$CI_MERGE_REQUEST_TARGET_BRANCH_NAME:refs/remotes/origin/$CI_MERGE_REQUEST_TARGET_BRANCH_NAME"
    - |
      GITLAB_TOKEN="$VIZZINI_GITLAB_TOKEN" vizzini-bot \
        --repo . \
        --base "origin/$CI_MERGE_REQUEST_TARGET_BRANCH_NAME" \
        --head "${CI_MERGE_REQUEST_SOURCE_BRANCH_SHA:-$CI_COMMIT_SHA}" \
        --pr-url "$CI_MERGE_REQUEST_PROJECT_URL/-/merge_requests/$CI_MERGE_REQUEST_IID" \
        --grant-policy .vizzini/grant-policy \
        --pr "gitlab:${CI_SERVER_HOST}/${CI_MERGE_REQUEST_PROJECT_PATH}!${CI_MERGE_REQUEST_IID}" \
        --requester "$GITLAB_USER_LOGIN" \
        --out "$tools-review.json"
